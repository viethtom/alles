function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var btn=document.getElementById('b'),err=document.getElementById('e');
  if(!window.crypto||!crypto.subtle){err.textContent='Dieser Browser unterstützt die Entschlüsselung nicht.';return}
  btn.disabled=true;btn.textContent='Prüfe …';err.textContent='';
  try{
    var pw=new TextEncoder().encode(document.getElementById('pw').value);
    var base=await crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(x){
    err.textContent='Das Passwort ist falsch.';
    btn.disabled=false;btn.textContent='Öffnen';
    document.getElementById('pw').select();
  }
});
